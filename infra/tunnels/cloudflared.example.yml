# Cloudflare Tunnel: 로컬 RTX 5090 AI 서버를 클라우드 백엔드만 접근 가능하도록 노출.
# 실제 적용:
#   cloudflared tunnel login
#   cloudflared tunnel create petfinect-ai
#   cloudflared tunnel route dns petfinect-ai ai.petfinect.internal
#   cloudflared tunnel run --config infra/tunnels/cloudflared.yml petfinect-ai

tunnel: petfinect-ai
credentials-file: ~/.cloudflared/petfinect-ai.json

ingress:
  - hostname: ai.petfinect.internal
    service: http://localhost:8800
    originRequest:
      noHappyEyeballs: true
  - service: http_status:404
