name: api

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: petfinect
          POSTGRES_PASSWORD: petfinect
          POSTGRES_DB: petfinect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petfinect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret
      POSTGRES_DSN: postgresql+asyncpg://petfinect:petfinect@postgres:5432/petfinect_test
      PYTEST_DSN: postgresql+asyncpg://petfinect:petfinect@postgres:5432/petfinect_test
      REDIS_URL: redis://redis:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Create virtualenv & install dev deps
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Wait for Postgres & create test database
        env:
          PGPASSWORD: petfinect
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h postgres -p 5432 -U petfinect; then
              echo "postgres ready"
              break
            fi
            echo "waiting for postgres... ($i)"
            sleep 2
          done
          psql -h postgres -U petfinect -d petfinect -c "CREATE DATABASE petfinect_test;" || true

      - name: Ruff lint
        working-directory: apps/api
        run: uv run ruff check app tests

      - name: Mypy (W1 freeze — non-blocking)
        working-directory: apps/api
        continue-on-error: true
        run: uv run mypy app

      - name: Pytest with coverage
        working-directory: apps/api
        run: uv run pytest -v --cov=app --cov-fail-under=70
