spring:
  application:
    name: petfinect-api

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5434/petfinect}
    username: ${POSTGRES_USER:petfinect}
    password: ${POSTGRES_PASSWORD:petfinect}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway 가 schema 관리; JPA 는 검증만
    properties:
      # Hibernate 6 은 PostgreSQLDialect 자동 감지 + hibernate-spatial 의존성만 있으면
      # geometry 타입 자동 처리. 명시 dialect 설정 불필요.
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Phase 9 — Python FastAPI 의 snake_case 직렬화 contract 와 1:1 매칭.
  # Java field 는 camelCase 그대로 두되 Jackson 이 자동 변환:
  #   serialize:   authCode (Java) → "auth_code" (JSON)
  #   deserialize: "auth_code" (JSON) → authCode (Java)
  # SNAKE_CASE 활성 시 camelCase JSON 키는 unknown 로 거부 (FAIL_ON_UNKNOWN_PROPERTIES 기본 true).
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8001                       # Python 백엔드 8000 과 충돌 회피

# Custom (PetFinect 전용)
petfinect:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    access-ttl-min: 15
    refresh-ttl-days: 14
  ai-server:
    base-url: ${AI_SERVER_URL:http://localhost:8800}
    shared-secret: ${AI_SERVER_SHARED_SECRET:dev-shared-secret}
    use-mock: ${AI_SERVER_USE_MOCK:true}        # true → MockAIServerClient (default). false → RealAIServerClient.
    mtls:
      ca-cert: ${AI_SERVER_CA_CERT:}             # 빈 값 → mTLS 비활성, plain HTTP/HTTPS 만.
      client-cert: ${AI_SERVER_CLIENT_CERT:}     # gen_dev_certs.sh 산출 client.crt
      client-key: ${AI_SERVER_CLIENT_KEY:}       # PKCS#8 PEM (openssl pkcs8 -topk8 -nocrypt 변환 필요)
  storage:
    bucket: ${S3_BUCKET:petfinect-dev}
    region: ${S3_REGION:ap-northeast-2}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}

# Actuator + OpenAPI
management:
  endpoints.web.exposure.include: health,info
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
  # 기본 미디어 타입 — springdoc 가 응답을 "*/*" 로 등록하지 않게 강제.
  # openapi-typescript codegen 이 application/json 키만 인식해 정확한 타입을 생성한다.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.security: INFO
