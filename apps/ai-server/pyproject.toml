[project]
name = "petfinect-ai-server"
version = "0.1.0"
description = "PetFinect local AI inference server (RTX 5090)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "torch>=2.5",
    "transformers>=4.46",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
