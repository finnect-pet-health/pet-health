[project]
name = "petfinect-ai-server"
version = "0.1.0"
description = "PetFinect local AI inference server (RTX 5090)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "torch>=2.5",
    "torchvision>=0.20",
    "torchaudio>=2.5",
    "transformers>=4.46",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "sklearn.*",
    "tqdm.*",
    "librosa.*",
    "transformers.*",
    "soundfile.*",
]
ignore_missing_imports = true
